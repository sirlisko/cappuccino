<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Can I have a cappuccino?</title>
  <meta name="description" content="Can I have a cappuccino right now? The Italian verdict, updated every minute.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cappuccino.sirlisko.com/">
  <meta property="og:title" content="Can I have a cappuccino?">
  <meta property="og:description"
    content="Can I have a cappuccino right now? The Italian verdict, updated every minute.">
  <meta property="og:image" content="https://cappuccino.sirlisko.com/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#c8102e">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
  <link rel="preload" href="fonts/jost.woff2" as="font" type="font/woff2" crossorigin>
  <noscript>
    <style>
      main noscript {
        display: contents
      }

      main> :not(noscript),
      footer .tools,
      #espresso {
        display: none
      }
    </style>
  </noscript>
  <style>
    @font-face {
      font-family: Jost;
      src: url(fonts/jost.woff2) format("woff2");
      font-weight: 100 900;
      /* block, not swap: a fallback font swapping out at 300px is a visible jump */
      font-display: block
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    body {
      --bg: #c8102e;
      --fg: #fff;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      gap: 32px;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.4 Jost, system-ui, sans-serif;
      padding: clamp(24px, 5vw, 56px) clamp(16px, 6vw, 88px);
      /* the whole page is tappable; this also makes iOS Safari fire clicks on plain text */
      cursor: pointer;
      touch-action: manipulation;
      transition: background .4s, color .4s
    }

    body[data-level="yes"] {
      --bg: #0d6b3f
    }

    body[data-level="maybe"] {
      --bg: #f4b400;
      --fg: #000
    }

    [data-theme="dark"] body {
      --bg: #5a0a15
    }

    [data-theme="dark"] body[data-level="yes"] {
      --bg: #0a3d26
    }

    [data-theme="dark"] body[data-level="maybe"] {
      --bg: #4d3600;
      --fg: #f4b400
    }

    .flag {
      display: flex;
      margin: 0 auto;
      width: 48px;
      height: 4px;
      /* without it the green and red stripes vanish into the matching backgrounds */
      outline: 1px solid var(--fg)
    }

    .flag i {
      flex: 1
    }

    .flag i:nth-child(1) {
      background: #009246
    }

    .flag i:nth-child(2) {
      background: #fff
    }

    .flag i:nth-child(3) {
      background: #ce2b37
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
      user-select: none
    }

    .q {
      font-size: clamp(21px, 3vw, 36px);
      line-height: 1.2;
      max-width: 30ch;
      text-wrap: balance
    }

    .answer {
      font: 800 clamp(96px, min(34vw, 40svh), 420px)/.8 Jost, sans-serif;
      letter-spacing: -.02em;
      padding: .04em 0;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
      transition: transform .15s
    }

    .answer[data-accent] {
      padding-top: .3em
    }

    .answer:active {
      transform: scale(.97)
    }

    .answer:focus-visible,
    footer a:focus-visible,
    footer button:focus-visible {
      outline: 3px solid currentColor;
      outline-offset: 4px
    }

    .line {
      font-size: clamp(22px, 2.8vw, 32px);
      font-weight: 500;
      line-height: 1.2;
      max-width: 28ch;
      min-height: 2.4em;
      text-wrap: balance
    }

    .hint {
      font-size: 15px;
      text-wrap: balance
    }

    footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      font-size: 15px
    }

    footer p {
      text-wrap: balance
    }

    footer a {
      color: inherit;
      text-underline-offset: 3px
    }

    .tools {
      display: flex;
      gap: 24px;
      margin-top: 6px
    }

    .share,
    .lang button {
      font: inherit;
      padding: 4px 0;
      border: 0;
      background: none;
      color: inherit;
      cursor: pointer
    }

    .share {
      text-decoration: underline;
      text-underline-offset: 3px
    }

    .lang {
      display: flex;
      gap: 12px
    }

    .lang button[aria-pressed="true"] {
      font-weight: 800;
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 3px
    }

    @media (max-height:450px) {
      .hint {
        display: none
      }

      main {
        gap: 8px
      }
    }
  </style>
</head>

<body>
  <div class="flag"><i></i><i></i><i></i></div>
  <main>
    <p class="q" id="q"></p>
    <button class="answer" id="answer" type="button" aria-describedby="line">…</button>
    <p class="line" id="line" aria-live="polite"></p>
    <p class="hint" id="hint"></p>
    <noscript>
      <p class="q">No JavaScript, no verdict.</p>
      <p class="answer">NO</p>
      <p class="line">Assume no. It's safer.</p>
    </noscript>
  </main>
  <footer>
    <p id="espresso"></p>
    <p id="credit">Made by <a href="https://sirlisko.com">sirlisko</a>, in memory of the original by <a
        href="https://www.raibaz.it/">raibaz</a>. Riposi in pace.</p>
    <div class="tools">
      <button class="share" id="share" type="button"></button>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="it">IT</button>
      </div>
    </div>
  </footer>
  <script>
    const TEXT = {
      en: {
        title: "Can I have a cappuccino?",
        q: t => `Can I have a cappuccino at\u00a0${t}?`,
        hint: "Tap to ask again. It won't change.",
        espresso: "An espresso, on the other hand, is always allowed.",
        credit: `Made by <a href="https://sirlisko.com">sirlisko</a>, in memory of the original by <a href="https://www.raibaz.it/">raibaz</a>. Riposi in pace.`,
        nags: ["The answer hasn't changed. Stop tapping.", "Tapping harder won't help.", "OK, I'm telling your nonna."],
        share: "Share",
        shareText: w => `Can I have a cappuccino right now? Apparently: ${w}`,
        copied: "Copied",
        copiedJoke: "Link copied. Go ruin their afternoon.",
      },
      it: {
        title: "Posso prendere un cappuccino?",
        q: t => `Posso prendere un cappuccino alle\u00a0${t}?`,
        hint: "Tocca per chiedere di nuovo. Non cambierà.",
        espresso: "Il caffè, invece, va sempre bene.",
        credit: `Fatto da <a href="https://sirlisko.com">sirlisko</a>, in memoria dell'originale di <a href="https://www.raibaz.it/">raibaz</a>. Riposi in pace.`,
        nags: ["La risposta non è cambiata. Smettila di toccare.", "Toccare più forte non serve.", "Va bene, lo dico a tua nonna."],
        share: "Condividi",
        shareText: w => `Posso prendere un cappuccino adesso? A quanto pare: ${w}`,
        copied: "Copiato",
        copiedJoke: "Link copiato. Vai a rovinargli il pomeriggio.",
      },
    };

    const BANDS = [
      {
        from: 5 * 60, to: 11 * 60, level: "yes", word: "SÌ", lines: {
          en: [
            "Go ahead. You are a civilized human being.",
            "Milk before 11? Correct. Your nonna is proud.",
            "Cappuccino e cornetto. As tradition intended.",
            "At the counter, standing up, in under three minutes. Like a professional.",
            "The foam is ready. The cocoa is optional. Your dignity is intact.",
            "Enjoy it. In a few hours this will be a crime.",
          ],
          it: [
            "Vai tranquillo. Sei una persona civile.",
            "Latte prima delle 11? Corretto. La nonna è fiera di te.",
            "Cappuccino e cornetto. Come tradizione comanda.",
            "Al banco, in piedi, in meno di tre minuti. Da professionista.",
            "La schiuma è pronta. Il cacao è facoltativo. La tua dignità è salva.",
            "Goditelo. Tra qualche ora sarà reato.",
          ],
        }
      },
      {
        from: 11 * 60, to: 12 * 60, level: "maybe", word: "MAH", lines: {
          en: [
            "Technically legal. Morally questionable.",
            "The barista will serve you. The barista will also judge you.",
            "Decide fast. Lunch is coming.",
            "Fine, but order it quietly. People are watching.",
            "A small one. No cocoa. Don't make eye contact.",
            "Your nonna isn't angry. She's disappointed.",
          ],
          it: [
            "Tecnicamente legale. Moralmente discutibile.",
            "Il barista te lo farà. Il barista ti giudicherà.",
            "Decidi in fretta. Sta arrivando il pranzo.",
            "Va bene, ma ordinalo a bassa voce. Ti guardano.",
            "Piccolo. Senza cacao. Non guardare nessuno negli occhi.",
            "La nonna non è arrabbiata. È delusa.",
          ],
        }
      },
      {
        from: 12 * 60, to: 16 * 60, level: "no", word: "NO", lines: {
          en: [
            "Milk. On top of lunch. Are you trying to kill yourself?",
            "You just had carbonara. Your stomach has filed a formal complaint.",
            "Have an espresso like an adult.",
            "Milk after pasta. Your digestion just resigned.",
            "The barista pretended not to hear you. Take the hint.",
            "Lunch is sacred. Don't drown it in milk.",
          ],
          it: [
            "Latte. Sopra il pranzo. Ma sei pazzo?",
            "Hai appena mangiato la carbonara. Il tuo stomaco ha sporto denuncia.",
            "Prenditi un caffè come le persone serie.",
            "Latte dopo la pasta. La tua digestione si è appena dimessa.",
            "Il barista ha fatto finta di non sentire. Cogli il segnale.",
            "Il pranzo è sacro. Non annegarlo nel latte.",
          ],
        }
      },
      {
        from: 16 * 60, to: 20 * 60, level: "no", word: "NO", lines: {
          en: [
            "A cappuccino at this hour? Welcome, tourist. Where's your hotel?",
            "Next you'll ask for pineapple on pizza.",
            "The barista will make it. Then call his mother to tell her about you.",
            "Sure. Would you like ketchup on your pasta too?",
            "Order it and they'll answer you in English.",
            "Only people with a selfie stick drink this at 5 pm.",
          ],
          it: [
            "Un cappuccino a quest'ora? Benvenuto, turista. In che hotel stai?",
            "Poi mi chiedi anche la pizza con l'ananas.",
            "Il barista te lo farà. Poi chiamerà sua madre per raccontarglielo.",
            "Certo. Vuoi anche il ketchup sulla pasta?",
            "Ordinalo e ti risponderanno in inglese.",
            "Alle cinque del pomeriggio lo beve solo chi ha il bastone per i selfie.",
          ],
        }
      },
      {
        from: 20 * 60, to: 26 * 60, level: "no", word: "NO!", lines: {
          en: [
            "After dinner?! Somewhere in Italia a nonna just fainted.",
            "Order one now and they'll deport you. Politely.",
            "Try an amaro. Or a digestivo. Or shame.",
            "The espresso machine is judging you. So are we.",
            "Milk after dinner. Bold. Wrong, but bold.",
            "Your ancestors are spinning in their graves. In unison.",
          ],
          it: [
            "Dopo cena?! Da qualche parte in Italia una nonna è appena svenuta.",
            "Ordinane uno adesso e ti espellono. Con educazione.",
            "Prova un amaro. O un digestivo. O la vergogna.",
            "La macchina del caffè ti sta giudicando. Anche noi.",
            "Latte dopo cena. Coraggioso. Sbagliato, ma coraggioso.",
            "I tuoi antenati si stanno rigirando nella tomba. All'unisono.",
          ],
        }
      },
      {
        from: 2 * 60, to: 5 * 60, level: "no", word: "BOH", lines: {
          en: [
            "It's the middle of the night. Go to sleep. Cappuccino opens at 5.",
            "The bar is closed. Italy is closed. Go to bed.",
            "Why are you awake? Why are you thinking about milk?",
            "Even the baristas are asleep. Be like the baristas.",
          ],
          it: [
            "È notte fonda. Vai a dormire. Il cappuccino apre alle 5.",
            "Il bar è chiuso. L'Italia è chiusa. Vai a letto.",
            "Perché sei sveglio? Perché pensi al latte?",
            "Anche i baristi dormono. Fai come i baristi.",
          ],
        }
      },
    ];
    // Checked before BANDS; each applies only on its day, within [from, to).
    const SPECIALS = [
      {
        month: 1, day: 1, from: 0, to: 12 * 60, level: "yes", word: "SÌ", lines: {
          en: [
            "You're still up from last night. Cappuccino allowed, just this once.",
            "Happy new year. The rules start again tomorrow.",
          ],
          it: [
            "Sei ancora sveglio da ieri sera. Cappuccino concesso, solo per stavolta.",
            "Buon anno. Le regole ripartono domani.",
          ],
        }
      },
      {
        month: 4, day: 1, from: 11 * 60, to: 24 * 60, level: "yes", word: "SÌ", lines: {
          en: [
            "Pesce d'aprile! Obviously not. Have an espresso.",
            "April fools. Did you really think the rules had changed?",
          ],
          it: [
            "Pesce d'aprile! Ovviamente no. Prenditi un caffè.",
            "Ci sei cascato. Pensavi davvero che le regole fossero cambiate?",
          ],
        }
      },
      {
        month: 8, day: 15, from: 12 * 60, to: 20 * 60, level: "no", word: "NO", lines: {
          en: [
            "It's Ferragosto. It's 38 degrees. You want hot milk?",
            "Everyone is at the beach. Even the barista. Especially the barista.",
          ],
          it: [
            "È Ferragosto. Ci sono 38 gradi. Vuoi il latte caldo?",
            "Sono tutti al mare. Anche il barista. Soprattutto il barista.",
          ],
        }
      },
      {
        month: 12, day: 25, from: 5 * 60, to: 11 * 60, level: "yes", word: "SÌ", lines: {
          en: [
            "Buon Natale. Cappuccino and panettone. Nonna approves.",
            "It's Christmas morning. Even the barista is smiling.",
          ],
          it: [
            "Buon Natale. Cappuccino e panettone. La nonna approva.",
            "È la mattina di Natale. Sorride persino il barista.",
          ],
        }
      },
      {
        month: 12, day: 25, from: 12 * 60, to: 20 * 60, level: "no", word: "NO", lines: {
          en: [
            "It's Christmas. You've been eating for six hours. No.",
            "Nonna made four courses. There is no room for milk.",
          ],
          it: [
            "È Natale. Mangi da sei ore. No.",
            "La nonna ha fatto quattro portate. Non c'è spazio per il latte.",
          ],
        }
      },
    ];
    // Easter egg: ?q=<any question>&name=<optional> always gets a NO, whatever the time.
    const params = new URLSearchParams(location.search);
    const custom = params.get("q")?.trim().slice(0, 200);
    const no = params.get("name") ? `No, ${params.get("name").trim().slice(0, 40)}.` : "No.";
    const CUSTOM = custom && {
      q: custom, level: "no", word: "NO", lines: {
        en: [
          `${no} Absolutely not.`,
          `${no} We don't even have a word for that.`,
          `${no} Nonna has been informed.`,
          `${no} That's not a drink. That's a dessert with an identity crisis.`,
        ],
        it: [
          `${no} Assolutamente no.`,
          `${no} Non abbiamo nemmeno una parola per questo.`,
          `${no} La nonna è stata avvisata.`,
          `${no} Quella non è una bevanda. È un dolce in crisi d'identità.`,
        ],
      }
    };
    const $ = id => document.getElementById(id);
    const pad = n => String(n).padStart(2, "0");
    const prefersDark = matchMedia("(prefers-color-scheme: dark)");

    function bandFor(d) {
      const mins = d.getHours() * 60 + d.getMinutes();
      const special = SPECIALS.find(s => s.month === d.getMonth() + 1 && s.day === d.getDate() && mins >= s.from && mins < s.to);
      return special || BANDS.find(b => (mins >= b.from && mins < b.to) || (mins + 1440 >= b.from && mins + 1440 < b.to));
    }

    function savedLang() {
      try { return localStorage.getItem("lang"); } catch { return null; }
    }

    let lang = TEXT[savedLang()] ? savedLang() : (navigator.language || "en").toLowerCase().startsWith("it") ? "it" : "en";
    let T = TEXT[lang];
    let current, lastLine = -1, taps = 0, shareReset;

    function applyTheme(h) {
      const dark = prefersDark.matches || h >= 20 || h < 5;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.body).getPropertyValue("--bg").trim();
    }
    function render(d) {
      if (CUSTOM) $("q").textContent = CUSTOM.q;
      else $("q").textContent = T.q(`${pad(d.getHours())}:${pad(d.getMinutes())}`);
      const band = CUSTOM || bandFor(d);
      if (band !== current) {
        current = band;
        taps = 0;
        document.body.dataset.level = band.level;
        const a = $("answer");
        a.textContent = band.word;
        a.toggleAttribute("data-accent", /[ÀÈÉÌÒÙ]/.test(band.word));
        nextLine();
      }
      applyTheme(d.getHours());
    }
    function nextLine() {
      const lines = current.lines[lang];
      let i;
      do { i = Math.floor(Math.random() * lines.length); } while (lines.length > 1 && i === lastLine);
      lastLine = i;
      $("line").textContent = lines[i];
    }
    function onTap() {
      taps++;
      // After 5 taps the page loses patience for 3 taps, then starts over.
      if (taps >= 5 && taps < 5 + T.nags.length) $("line").textContent = T.nags[taps - 5];
      else { if (taps >= 5 + T.nags.length) taps = 0; nextLine(); }
    }
    function tick() {
      const d = new Date();
      render(d);
      setTimeout(tick, (60 - d.getSeconds()) * 1000);
    }
    function setLang(l) {
      lang = l;
      T = TEXT[l];
      document.documentElement.lang = l;
      document.title = T.title;
      $("hint").textContent = T.hint;
      $("espresso").textContent = T.espresso;
      $("credit").innerHTML = T.credit;
      $("share").textContent = T.share;
      document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l));
      current = undefined;
      render(new Date());
    }
    async function share() {
      const url = CUSTOM ? location.href : document.querySelector('meta[property="og:url"]').content;
      const text = CUSTOM ? `${CUSTOM.q} ${current.word}.` : T.shareText(current.word);
      if (navigator.share) {
        try { await navigator.share({ title: T.title, text, url }); } catch { }
        return;
      }
      try {
        await navigator.clipboard.writeText(`${text} ${url}`);
        $("share").textContent = T.copied;
        $("hint").textContent = T.copiedJoke;
        clearTimeout(shareReset);
        shareReset = setTimeout(() => {
          $("share").textContent = T.share;
          $("hint").textContent = T.hint;
        }, 2500);
      } catch { }
    }

    document.addEventListener("click", e => { if (!e.target.closest("a, .tools")) onTap(); });
    $("share").addEventListener("click", share);
    document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
      try { localStorage.setItem("lang", b.dataset.lang); } catch { }
      setLang(b.dataset.lang);
    }));
    prefersDark.addEventListener("change", () => applyTheme(new Date().getHours()));
    setLang(lang);
    tick();
  </script>
</body>

</html>
